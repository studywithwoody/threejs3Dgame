name: Check migrations

on:
  pull_request:
    paths:
      - "drizzle/**"
      - "drizzle.config.ts"
      - "src/db/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/db-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Schema matches migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check migration history
        run: npm run db:check

      - name: Confirm schema and migrations match
        run: |
          set -euo pipefail
          npm run db:generate
          status="$(git status --porcelain -- drizzle)"
          if [ -n "$status" ]; then
            echo "src/db schema and drizzle/ migrations differ. Run npm run db:generate and commit the files."
            echo "$status"
            git diff -- drizzle || true
            git ls-files --others --exclude-standard -- drizzle | while IFS= read -r file; do
              echo "----- untracked ${file} -----"
              git diff --no-index -- /dev/null "$file" || true
            done
            exit 1
          fi
