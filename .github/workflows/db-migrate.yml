name: Migrate database

on:
  push:
    branches:
      - main
    paths:
      - "drizzle/**"
      - "drizzle.config.ts"
      - "src/db/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-migrate-production
  cancel-in-progress: false

jobs:
  migrate:
    name: Migrate Neon
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Require main
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Refusing to migrate: production migrations only run from main (this ref is $GITHUB_REF)."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
        run: |
          set -euo pipefail
          if [ -z "$DATABASE_URL_UNPOOLED" ]; then
            echo "GitHub Actions secret DATABASE_URL_UNPOOLED is not set."
            exit 1
          fi
          npm run db:migrate
